name: passive-research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 2"

concurrency:
  group: passive-research
  cancel-in-progress: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  hunt:
    name: Passive collection
    runs-on: ubuntu-latest
    environment: passive-research
    timeout-minutes: 15
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-runtime.lock
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-runtime.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run bounded passive collection
        env:
          GITHUB_TOKEN: ${{ secrets.SERPENS_GITHUB_TOKEN }}
        run: serpens-scout hunt --out research-output --github-limit 40
      - name: Upload research receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: serpens-scout-${{ github.run_id }}
          path: research-output/
          retention-days: 30
