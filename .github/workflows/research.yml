name: passive-research

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 2"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Run bounded passive collection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: serpens-scout hunt --out research-output --github-limit 40
      - uses: actions/upload-artifact@v4
        with:
          name: serpens-scout-${{ github.run_id }}
          path: research-output/
          retention-days: 30
