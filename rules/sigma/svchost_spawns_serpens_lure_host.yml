title: Svchost Spawns Screening Serpens Associated Host Name
id: 93e585d0-6ba7-42ca-9922-cd67c7787b73
status: experimental
description: Detects the unusual svchost-to-lure-host process relationship described by Unit 42.
references:
  - https://unit42.paloaltonetworks.com/tracking-iran-apt-screening-serpens/
author: Skein LLC
date: 2026-07-17
tags:
  - attack.execution
  - attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  parent:
    ParentImage|endswith: '\\svchost.exe'
  child:
    Image|endswith:
      - '\\update.exe'
      - '\\SoftwareLicencing.exe'
  condition: parent and child
falsepositives:
  - Vendor update services using a generic update executable name
level: medium
