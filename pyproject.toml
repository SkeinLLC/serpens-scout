[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serpens-scout"
version = "0.1.0"
description = "Passive Screening Serpens research, AppDomainManager config detection, and STIX export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skein LLC" }]
dependencies = ["defusedxml>=0.7.1,<0.8"]
keywords = ["threat-intelligence", "malware", "appdomainmanager", "stix", "osint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4,<2",
  "pip-audit>=2.10.1,<3",
  "pytest>=8.0",
  "ruff>=0.8",
  "stix2>=3.0.1",
  "stix2-validator>=3.2.0",
  "zizmor>=1.27.0,<2",
]

[project.scripts]
serpens-scout = "serpens_scout.cli:main"

[project.urls]
Homepage = "https://github.com/SkeinLLC/serpens-scout"
Issues = "https://github.com/SkeinLLC/serpens-scout/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S310"]
